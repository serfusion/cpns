plugins { id 'com.android.application' }
android {
    namespace 'id.latihanskd.app'
    compileSdk 34
    defaultConfig {
        applicationId 'id.latihanskd.app'
        minSdk 21
        targetSdk 34
        // Nomor build CI dipakai sebagai versionCode agar APK baru selalu bisa dipasang menimpa yang lama.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger() + 100)
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }
    // Kunci tanda tangan tetap (kunci debug standar Android, bukan rahasia) agar setiap APK
    // ditandatangani sama dan bisa diperbarui tanpa uninstal.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
