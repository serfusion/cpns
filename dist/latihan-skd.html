<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Latihan SKD CPNS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Latihan soal SKD CPNS: TWK, TIU, TKP dengan koreksi langsung dan simulasi CAT 110 soal.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Tata letak: bilah atas lekat + satu kolom tengah (maks 1080px).
   Layar kuis = kolom soal + rel nomor soal, meniru alur kerja CAT. */
:root {
  --bg: #f1f3f8;
  --surface: #ffffff;
  --surface-2: #e7ebf4;
  --ink: #111a2e;
  --muted: #536079;
  --line: #d3d9e7;
  --accent: #2147c7;
  --accent-ink: #ffffff;
  --accent-soft: #e2e9ff;
  --ok: #0c7a53;
  --ok-ink: #ffffff;
  --ok-soft: #d8f3e6;
  --bad: #c02b26;
  --bad-ink: #ffffff;
  --bad-soft: #fde3e1;
  --warn: #9a5a00;
  --warn-ink: #ffffff;
  --warn-soft: #fff0d0;
  --fig-bg: #ffffff;
  --fig-ink: #111a2e;
  --shadow: 0 1px 2px rgba(17, 26, 46, 0.06), 0 6px 20px rgba(17, 26, 46, 0.06);

  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;

  --fs-xs: 0.78rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.75rem;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --bar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111e;
    --surface: #141c2d;
    --surface-2: #1c2740;
    --ink: #e7ebf5;
    --muted: #98a4be;
    --line: #2a3654;
    --accent: #8eadff;
    --accent-ink: #0b1220;
    --accent-soft: #1a2a52;
    --ok: #45cb97;
    --ok-ink: #062116;
    --ok-soft: #0f3426;
    --bad: #ff8279;
    --bad-ink: #2a0907;
    --bad-soft: #43201d;
    --warn: #f0b552;
    --warn-ink: #2a1a00;
    --warn-soft: #3a2b0d;
    --fig-bg: #f4f6fb;
    --fig-ink: #111a2e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111e;
  --surface: #141c2d;
  --surface-2: #1c2740;
  --ink: #e7ebf5;
  --muted: #98a4be;
  --line: #2a3654;
  --accent: #8eadff;
  --accent-ink: #0b1220;
  --accent-soft: #1a2a52;
  --ok: #45cb97;
  --ok-ink: #062116;
  --ok-soft: #0f3426;
  --bad: #ff8279;
  --bad-ink: #2a0907;
  --bad-soft: #43201d;
  --warn: #f0b552;
  --warn-ink: #2a1a00;
  --warn-soft: #3a2b0d;
  --fig-bg: #f4f6fb;
  --fig-ink: #111a2e;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.55;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: var(--fs-2xl); font-weight: 800; }
h2 { font-size: var(--fs-xl); font-weight: 700; }
h3 { font-size: var(--fs-lg); font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num-font, .tab { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: var(--fs-sm); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- kerangka ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.topbar-in, .wrap {
  max-width: 1080px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { display: flex; align-items: center; gap: 8px 20px; min-height: var(--bar-h); flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; color: var(--ink); text-decoration: none; padding-block: 8px; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 0.8rem; letter-spacing: 0.02em; }
.nav { display: flex; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  flex: none; padding: 8px 12px; border-radius: 999px; text-decoration: none; color: var(--muted);
  font-family: var(--font-display); font-weight: 600; font-size: var(--fs-sm); white-space: nowrap;
}
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.sync { font-size: var(--fs-xs); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
main.wrap { padding-block: 24px 56px; display: flex; flex-direction: column; gap: 24px; min-height: 60vh; }
.foot { padding-block: 0 32px; color: var(--muted); font-size: var(--fs-xs); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.lede { color: var(--muted); max-width: 65ch; }

/* ---------- tombol & kontrol ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 8px 16px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-sm);
  cursor: pointer; text-decoration: none; transition: background 0.12s, border-color 0.12s, transform 0.05s;
}
.btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.btn.ok:hover { filter: brightness(1.08); background: var(--ok); }
.btn.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--ink); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.btn.danger:hover { filter: brightness(1.08); background: var(--bad); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: var(--fs-xs); }
.btn.lg { min-height: 50px; padding: 10px 22px; font-size: var(--fs-md); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.72rem; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; color: var(--muted); background: var(--surface); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: var(--r-md); }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 7px; font-family: var(--font-display); font-weight: 700; font-size: var(--fs-sm); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
  padding: 6px 12px; font-size: var(--fs-sm); cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip .n { color: var(--muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > .label, .label { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-sm); }
.input { min-height: 42px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); width: 100%; max-width: 120px; }

/* ---------- kartu ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 12px 14px; border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: var(--fs-sm); }
.note.info { border-left-color: var(--accent); background: var(--accent-soft); }

/* ---------- beranda ---------- */
.hero { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: stretch; }
.hero-main { background: var(--accent); color: var(--accent-ink); border-radius: var(--r-lg); padding: 28px; display: flex; flex-direction: column; gap: 14px; justify-content: space-between; }
.hero-main h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); }
.hero-main p { opacity: 0.92; max-width: 46ch; }
.hero-main .btn { background: var(--surface); color: var(--ink); border-color: transparent; }
.hero-main .btn.ghost { background: transparent; color: inherit; border-color: currentColor; }
.hero-main .btn:hover { filter: brightness(0.96); }
.format { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.fact { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.fact b { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 800; font-variant-numeric: tabular-nums; }
.fact span { font-size: var(--fs-xs); color: var(--muted); }
.fact.wide { grid-column: 1 / -1; }
.sec-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.sec-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; min-width: 0; }
.sec-top { padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.sec-top .short { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-xl); }
.mlist { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; }
.mrow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r-sm); background: transparent; border: 0; text-align: left; cursor: pointer; width: 100%; color: inherit; }
.mrow:hover { background: var(--accent-soft); }
.mrow .nm { flex: 1 1 auto; min-width: 0; font-size: var(--fs-sm); font-weight: 600; }
.mrow .ct { font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mgroup { padding: 8px 12px 2px; font-size: var(--fs-xs); font-weight: 700; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.sec-foot { padding: 12px 18px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- meter & angka ---------- */
.meter { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; min-width: 60px; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); min-width: 0; }
.meter.ok { background: var(--ok-soft); }
.meter.ok > i { background: var(--ok); }
.meter.warn { background: var(--warn-soft); }
.meter.warn > i { background: var(--warn); }
.meter.bad { background: var(--bad-soft); }
.meter.bad > i { background: var(--bad); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .v { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-2xl); font-variant-numeric: tabular-nums; line-height: 1.15; }
.tile .l { font-size: var(--fs-xs); color: var(--muted); }
.tile .d { font-size: var(--fs-xs); color: var(--muted); }

.tablewrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.data th, table.data td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data th { font-family: var(--font-display); font-size: var(--fs-xs); color: var(--muted); font-weight: 700; white-space: nowrap; }
table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tr.grp td { background: var(--surface-2); font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xs); letter-spacing: 0.04em; }
table.data td .meter { width: 120px; }

/* ---------- layar kuis ---------- */
.catbar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); z-index: 15;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 14px; box-shadow: var(--shadow);
}
.catbar .ttl { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-sm); margin-right: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cat-info { display: flex; gap: 16px; flex-wrap: wrap; }
.cat-info div { display: flex; flex-direction: column; line-height: 1.2; }
.cat-info span { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.cat-info b { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: var(--fs-md); }
.cat-info .time b { font-size: var(--fs-lg); }
.cat-info .time.low b { color: var(--bad); }
.quiz { display: grid; grid-template-columns: minmax(0, 1fr) 292px; gap: 16px; align-items: start; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qhead .no { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-lg); margin-right: 4px; }
.passage { background: var(--surface-2); border-radius: var(--r-md); padding: 14px 16px; font-size: var(--fs-md); white-space: pre-line; max-height: 46vh; overflow-y: auto; }
.qtext { font-size: 1.06rem; line-height: 1.6; white-space: pre-line; max-width: 72ch; }
.qtable { overflow-x: auto; }
.qtable table { border-collapse: collapse; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.qtable th, .qtable td { border: 1px solid var(--line); padding: 6px 12px; text-align: center; }
.qtable th { background: var(--surface-2); font-family: var(--font-display); }

.opts { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
.opt {
  width: 100%; display: flex; align-items: flex-start; gap: 12px; text-align: left;
  padding: 12px 14px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--surface);
  cursor: pointer; transition: background 0.1s, border-color 0.1s; color: var(--ink); line-height: 1.5;
}
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.opt[disabled] { cursor: default; }
.opt-k {
  flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: var(--fs-sm); background: var(--surface); color: var(--muted);
}
.opt-t { flex: 1 1 auto; min-width: 0; padding-top: 3px; white-space: pre-line; }
.opt-tag { flex: none; align-self: center; }
.opt.is-picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-picked .opt-k { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.is-right { border-color: var(--ok); background: var(--ok-soft); border-width: 2px; }
.opt.is-right .opt-k { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); border-width: 2px; }
.opt.is-wrong .opt-k { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.opt.is-mid { border-color: var(--warn); background: var(--warn-soft); border-width: 2px; }
.opt.is-mid .opt-k { background: var(--warn); border-color: var(--warn); color: var(--warn-ink); }
.opt.is-dim { opacity: 0.72; }

.fig { display: block; width: 100%; aspect-ratio: 1; max-width: 100%; background: var(--fig-bg); color: var(--fig-ink); border: 1px solid var(--line); border-radius: var(--r-sm); }
.fig svg { display: block; width: 100%; height: 100%; }
.fig.q { background: var(--accent-soft); color: var(--accent); border-style: dashed; border-color: var(--accent); }
.stem { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stem .fig { width: clamp(52px, 17vw, 92px); flex: none; }
.stem .sep { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-xl); color: var(--muted); padding-inline: 2px; }
.stem.matriks { display: grid; grid-template-columns: repeat(3, clamp(52px, 20vw, 86px)); gap: 6px; }
.stem.matriks .fig { width: 100%; }
.stem.jaring .fig { width: min(280px, 78vw); aspect-ratio: 1; }
.opts.figs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; max-width: 560px; }
.opts.figs .opt { flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
.opts.figs .opt-t { padding: 0; width: 100%; }
.opts.figs .opt-tag { align-self: center; }

.qactions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.qactions .hint { margin-left: auto; font-size: var(--fs-xs); color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.feedback { border-radius: var(--r-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); }
.feedback .verdict { font-family: var(--font-display); font-weight: 800; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feedback.right { border-color: var(--ok); background: var(--ok-soft); }
.feedback.right .verdict { color: var(--ok); }
.feedback.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback.wrong .verdict { color: var(--bad); }
.feedback.mid { border-color: var(--warn); background: var(--warn-soft); }
.feedback.mid .verdict { color: var(--warn); }
.feedback .expl { white-space: pre-line; max-width: 72ch; }
.feedback .expl-l { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }

.rail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 78px); max-height: calc(100vh - var(--bar-h) - 100px); overflow-y: auto; }

.modal { background: var(--surface); color: var(--ink); border-radius: var(--r-lg); border: 1px solid var(--line); max-width: 440px; width: 100%; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }

  function blank() {
    var pass = {};
    CFG.sections.forEach(function (s) { pass[s.id] = s.pass; });
    // q[id] = [dilihat, benar, beruntun benar, waktu terakhir, poin terakhir, jumlah poin]
    return { v: 1, q: {}, hist: [], set: { pass: pass, instant: true, requeue: true, ts: 0 }, resetAt: 0 };
  }
  function sane(d) {
    var b = blank(), k;
    if (!d || typeof d !== "object" || d.v !== 1) return b;
    if (d.q && typeof d.q === "object") {
      for (k in d.q) {
        var e = d.q[k];
        if (Array.isArray(e) && e.length >= 5) b.q[k] = [num(e[0]), num(e[1]), num(e[2]), num(e[3]), num(e[4]), num(e[5])];
      }
    }
    if (Array.isArray(d.hist)) b.hist = d.hist.filter(function (h) { return h && typeof h.t === "number" && h.s; }).slice(-60);
    if (d.set && typeof d.set === "object") {
      if (d.set.pass && typeof d.set.pass === "object") {
        CFG.sections.forEach(function (s) {
          var v = num(d.set.pass[s.id]);
          if (v > 0 && v <= s.max) b.set.pass[s.id] = Math.round(v);
        });
      }
      b.set.instant = d.set.instant !== false;
      b.set.requeue = d.set.requeue !== false;
      b.set.ts = num(d.set.ts);
    }
    b.resetAt = num(d.resetAt);
    return b;
  }

  var data = blank(), listeners = [];
  var cloud = { state: "lokal", doc: null, busy: false, dirty: false, timer: null };

  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* abaikan */ } }
  function emit() { listeners.forEach(function (fn) { try { fn(); } catch (e) { /* abaikan */ } }); }

  function persist() {
    lsSet(KEY, JSON.stringify(data));
    schedulePush();
  }

  // ---------- sinkronisasi (hanya bila tersedia) ----------
  function mergeIn(remote) {
    var resetAt = Math.max(data.resetAt, remote.resetAt), q = {}, seenT = {}, hist = [];
    [data.q, remote.q].forEach(function (src) {
      for (var k in src) {
        var e = src[k];
        if (e[3] <= resetAt) continue;
        if (!q[k] || e[3] > q[k][3]) q[k] = e;
      }
    });
    data.hist.concat(remote.hist).forEach(function (h) {
      if (h.t > resetAt && !seenT[h.t]) { seenT[h.t] = 1; hist.push(h); }
    });
    hist.sort(function (a, b) { return a.t - b.t; });
    data = { v: 1, q: q, hist: hist.slice(-60), set: remote.set.ts > data.set.ts ? remote.set : data.set, resetAt: resetAt };
  }
  function timeout(p, ms) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject(new Error("timeout")); }, ms);
      p.then(function (v) { clearTimeout(t); resolve(v); }, function (e) { clearTimeout(t); reject(e); });
    });
  }
  function initCloud() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) throw new Error("tidak tersedia");
      return user.id().then(function (uid) {
        if (!uid) throw new Error("tanpa identitas");
        cloud.doc = db.doc("data/users/" + uid + "/progres");
        return timeout(cloud.doc.get(), 10000);
      });
    }).then(function (snap) {
      if (snap && snap.exists) {
        var remote = snap.data();
        if (remote) mergeIn(sane(JSON.parse(JSON.stringify(remote))));
      }
      cloud.state = "aktif";
      lsSet(KEY, JSON.stringify(data));
      emit();
      push();
    }).catch(function () {
      cloud.state = "lokal";
      cloud.doc = null;
    });
  }
  function schedulePush() {
    if (!cloud.doc || cloud.state !== "aktif") return;
    clearTimeout(cloud.timer);
    cloud.timer = setTimeout(push, 2500);
  }
  function push() {
    if (!cloud.doc || cloud.state !== "aktif") return;
    if (cloud.busy) { cloud.dirty = true; return; }
    cloud.busy = true;
    cloud.dirty = false;
    cloud.doc.set(JSON.parse(JSON.stringify(data))).then(null, function (e) {
      var code = e && e.code;
      if (code !== "unavailable" && code !== "resource_exhausted") { cloud.state = "lokal"; cloud.doc = null; emit(); }
    }).then(function () {
      cloud.busy = false;
      if (cloud.dirty) schedulePush();
    });
  }

  // ---------- API ----------
  function record(pq, pts) {
    var key = pq.id || "gen:" + pq.m, e = data.q[key] || [0, 0, 0, 0, 0, 0];
    e[0]++;
    if (pts === 5) { e[1]++; e[2]++; } else e[2] = 0;
    e[3] = Date.now();
    e[4] = pts;
    e[5] += pts;
    data.q[key] = e;
    persist();
  }
  /** Ringkasan per materi: { id: {seen, right, pts, uniq, review, mastered, total} } */
  function materiStats() {
    var out = {}, E = SKD.engine;
    CFG.materi.forEach(function (m) {
      out[m.id] = { seen: 0, right: 0, pts: 0, uniq: 0, review: 0, mastered: 0, total: E.poolOf(m.id).length };
    });
    for (var k in data.q) {
      var e = data.q[k], m, q = null;
      if (k.indexOf("gen:") === 0) m = k.slice(4);
      else { q = E.byId(k); if (!q) continue; m = q.m; }
      var o = out[m];
      if (!o) continue;
      o.seen += e[0];
      o.right += e[1];
      o.pts += e[5];
      if (q) {
        o.uniq++;
        if (E.needsReview(q.sec, e)) o.review++;
        else if (e[2] >= 2) o.mastered++;
      }
    }
    return out;
  }
  function reviewIds(sec) {
    var out = [], E = SKD.engine;
    for (var k in data.q) {
      if (k.indexOf("gen:") === 0) continue;
      var q = E.byId(k);
      if (q && (!sec || q.sec === sec) && E.needsReview(q.sec, data.q[k])) out.push({ id: k, t: data.q[k][3] });
    }
    out.sort(function (a, b) { return b.t - a.t; });
    return out.map(function (x) { return x.id; });
  }

  SKD.store = {
    init: function () {
      var raw = lsGet(KEY);
      if (raw) { try { data = sane(JSON.parse(raw)); } catch (e) { data = blank(); } }
      initCloud();
    },
    onChange: function (fn) { listeners.push(fn); },
    record: record,
    qstats: function () { return data.q; },
    materiStats: materiStats,
    reviewIds: reviewIds,
    history: function () { return data.hist; },
    addHistory: function (h) { data.hist.push(h); data.hist = data.hist.slice(-60); persist(); },
    settings: function () { return data.set; },
    setPass: function (sec, v) { data.set.pass[sec] = v; data.set.ts = Date.now(); persist(); },
    setFlag: function (k, v) { data.set[k] = !!v; data.set.ts = Date.now(); persist(); },
    resetPass: function () { data.set.pass = blank().set.pass; data.set.ts = Date.now(); persist(); },
    saveSession: function (s) { return lsSet(KEY_SESI, JSON.stringify(s)); },
    loadSession: function () {
      var raw = lsGet(KEY_SESI);
      if (!raw) return null;
      try { var s = JSON.parse(raw); return s && Array.isArray(s.items) && s.items.length ? s : null; } catch (e) { return null; }
    },
    clearSession: function () { lsDel(KEY_SESI); },
    resetAll: function () {
      var set = data.set;
      data = blank();
      data.set = set;
      data.resetAt = Date.now();
      lsDel(KEY_SESI);
      persist();
      emit();
    },
    cloudState: function () { return cloud.state; },
    _sane: sane
  };
})();

</script>

<script>
/* Halaman Formasi: strategi pemilihan formasi CPNS 2026 + cek profil + kalkulator peluang.
   Data ada di data/formasi.js. Isian pengguna disimpan di localStorage perangkat ini saja. */
(function () {
  "use strict";
  var SKD = (window.SKD = window.SKD || {});
  var KEY = "skd.formasi.v1";
  var AKR = [
    { v: "A", t: "A / Unggul" },
    { v: "B", t: "B / Baik Sekali" },
    { v: "C", t: "C / Baik" },
    { v: "?", t: "Belum tahu" }

  var LOK = [
    { v: "jabo", t: "Jabodetabek saja" },
    { v: "jabo-nasional", t: "Jabodetabek dulu, siap nasional" },

  var SAING = { rendah: ["ok", "Persaingan rendah"], sedang: ["warn", "Persaingan sedang"], tinggi: ["bad", "Persaingan tinggi"] };
  var COCOK = { tinggi: "Cocok minat IT/digital", sedang: "Cukup cocok" };
  var LISAN = { rendah: ["ok", "Sedikit bicara"], sedang: ["warn", "Sebagian tugas lisan"], tinggi: ["bad", "Banyak bicara"] };

  function blank() { return { profil: { ipk: "", akr: "B", usia: "", lokasi: "jabo-nasional", nonverbal: true }, kandidat: [], cek: {} }; }
  function numOr(v, d) { var n = Number(String(v).replace(",", ".")); return isFinite(n) && n > 0 ? n : d; }
  function sane(d) {
    var b = blank();
    if (!d || typeof d !== "object") return b;
    var p = d.profil || {};
    b.profil.ipk = typeof p.ipk === "string" ? p.ipk.slice(0, 5) : "";
    b.profil.usia = typeof p.usia === "string" ? p.usia.slice(0, 3) : "";
    if (AKR.some(function (a) { return a.v === p.akr; })) b.profil.akr = p.akr;
    if (LOK.some(function (a) { return a.v === p.lokasi; })) b.profil.lokasi = p.lokasi;
    if (p.nonverbal === false) b.profil.nonverbal = false;
    if (Array.isArray(d.kandidat)) {
      b.kandidat = d.kandidat.filter(function (k) { return k && typeof k.nama === "string"; }).slice(0, 40).map(function (k) {
        return { id: String(k.id || Math.random()), nama: k.nama.slice(0, 160), kursi: numOr(k.kursi, 1), pelamar: numOr(k.pelamar, 0), sejenis: numOr(k.sejenis, 0) };
      });
    }
    if (d.cek && typeof d.cek === "object") for (var c in d.cek) if (d.cek[c] === true) b.cek[c] = true;
    return b;
  }
  var st = null;
  function state() {
    if (!st) {
      var raw = null;
      try { raw = JSON.parse(window.localStorage.getItem(KEY) || "null"); } catch (e) { raw = null; }
      st = sane(raw);
    }
    return st;
  }
  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* mode privat: abaikan */ } }

  function fmt(n, dig) {
    var s = (Math.round(n * Math.pow(10, dig || 0)) / Math.pow(10, dig || 0)).toFixed(dig || 0);
    var parts = s.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return parts.join(",");
  }

  /** Analisis satu kandidat formasi: rasio, kursi SKB (3x kursi), dan posisi yang harus dicapai di SKD. */
  function analisis(k) {
    var kursi = Math.max(1, Math.round(k.kursi)), n = Math.max(0, Math.round(k.pelamar)), skb = kursi * 3;
    var rasio = n / kursi, lev = rasio <= 10 ? "rendah" : rasio <= 30 ? "sedang" : "tinggi";
    var posisi = n <= skb ? "Cukup lulus ambang batas untuk ikut SKB" : "Masuk " + fmt(skb) + " besar dari " + fmt(n) + " (" + fmt((skb / n) * 100, skb / n < 0.1 ? 1 : 0) + "% teratas)";
    return { kursi: kursi, n: n, skb: skb, rasio: rasio, lev: lev, posisi: posisi };
  }
  SKD.formasiAnalisis = analisis; // untuk pengujian

  SKD.formasiView = function (ctx) {
    var h = ctx.h, D = SKD.formasi, S = state(), P = S.profil;
    if (!D) return h("p", null, "Data formasi belum dimuat.");

    function set(path, v) { P[path] = v; save(); ctx.rerender(); }

    // ---------- cek profil ----------
    function checks() {
      var out = [], ipk = numOr(P.ipk, 0), usia = numOr(P.usia, 0), hist = ctx.history(), best = null;

      else out.push(["bad", "IPK di bawah 2,75: sebagian besar formasi S-1 tertutup."]);
      if (P.akr === "A") out.push(["ok", "Akreditasi A/Unggul pada tahun lulus: formasi umum terbuka; formasi cumlaude juga terbuka bila ijazah berpredikat dengan pujian."]);
      else if (P.akr === "B") out.push(["warn", "Akreditasi B/Baik Sekali pada tahun lulus: formasi umum terbuka, tetapi formasi cumlaude dan formasi yang mensyaratkan A/Unggul tertutup. Akreditasi yang dipakai adalah yang berlaku saat lulus, bukan akreditasi sekarang."]);
      else if (P.akr === "C") out.push(["bad", "Akreditasi C/Baik pada tahun lulus: banyak instansi pusat mensyaratkan minimal B. Saring formasinya dengan teliti."]);
      else out.push(["", "Cari SK akreditasi prodi dan kampus yang berlaku pada tanggal kelulusan di ijazah (BAN-PT atau kampus)."]);
      if (!usia) out.push(["", "Isi usia saat pendaftaran ditutup."]);

      else out.push(["bad", "Usia di atas 35 tahun: tidak memenuhi batas umum CPNS (kecuali jabatan tertentu)."]);
      if (P.nonverbal) out.push(["ok", "Filter aktif: jabatan yang tugas intinya bicara di depan orang (protokol, instruktur, penggerak masyarakat, fasilitator, edukator) disembunyikan."]);
      if (P.lokasi === "jabo") out.push(["warn", "Hanya Jabodetabek berarti hanya formasi yang paling ramai. Pertimbangkan Tier 1 di luar Jabodetabek bila peluang lebih penting."]);
      else out.push(["ok", "Siap ditempatkan di luar Jabodetabek: Tier 1 di bawah terbuka untuk Anda."]);

      if (!best) out.push(["", "Belum ada simulasi penuh 110 soal. Kerjakan satu untuk mengukur posisi Anda."]);
      else out.push([best.pass ? (best.total >= 400 ? "ok" : "warn") : "bad", "Simulasi penuh terbaik: " + best.total + (best.pass ? " (lulus ambang batas" + (best.total >= 400 ? ", sudah di atas target 400)." : "). Kejar 400 atau lebih supaya aman di formasi yang ramai.") : " (belum lulus ambang batas tiap subtes).")]);

    }

    var profil = h("section", { class: "panel", "aria-labelledby": "fm-profil" },
      h("h2", { id: "fm-profil" }, "Cek profil"),
      h("p", { class: "small muted" }, "Jurusan: " + D.jurusan + ". Isian ini hanya tersimpan di perangkat ini."),
      h("div", { class: "row fm-fields" },
        h("label", { class: "field" }, h("span", { class: "label" }, "IPK"),
          h("input", { class: "input", id: "fm-ipk", inputmode: "decimal", placeholder: "3,25", value: P.ipk, onchange: function (e) { set("ipk", e.target.value.trim().slice(0, 5)); } })),
        h("label", { class: "field" }, h("span", { class: "label" }, "Usia saat pendaftaran ditutup"),
          h("input", { class: "input", id: "fm-usia", inputmode: "numeric", placeholder: "30", value: P.usia, onchange: function (e) { set("usia", e.target.value.trim().slice(0, 3)); } })),
        h("label", { class: "field" }, h("span", { class: "label" }, "Akreditasi prodi pada tahun lulus"),
          h("select", { class: "input wide", id: "fm-akr", onchange: function (e) { set("akr", e.target.value); } },
            AKR.map(function (a) { return h("option", { value: a.v, selected: P.akr === a.v }, a.t); })))),
      h("label", { class: "check" }, h("input", { type: "checkbox", id: "fm-nonverbal", checked: P.nonverbal, onchange: function (e) { set("nonverbal", e.target.checked); } }),
        h("span", null, h("b", null, "Hindari jabatan yang banyak bicara di depan orang. "), "Prioritas pada kerja belakang layar: arsip, data, dokumen, media.")),
      h("div", { class: "field" }, h("span", { class: "label" }, "Penempatan"),
        h("div", { class: "seg", role: "group", "aria-label": "Penempatan" }, LOK.map(function (l) {
          return h("button", { type: "button", "aria-pressed": P.lokasi === l.v ? "true" : "false", onclick: function () { set("lokasi", l.v); } }, l.t);
        }))),
      h("ul", { class: "fm-checks" }, checks().map(function (c) {
        return h("li", null, h("span", { class: "tag " + (c[0] || "") }, c[0] === "ok" ? "Aman" : c[0] === "warn" ? "Perhatikan" : c[0] === "bad" ? "Kendala" : "Isi"), h("span", null, c[1]));
      })));

    // ---------- target ----------
    var target = h("section", { class: "stack", "aria-labelledby": "fm-target" },
      h("h2", { id: "fm-target" }, "Peringkat target untuk Anda"),
      h("p", { class: "lede" }, "Prioritas: peluang lolos lebih dulu, kerja belakang layar, instansi populer tidak wajib. Urutan ini disusun dari pola formasi dan hasil seleksi 2024, jadi cocokkan dengan formasi 2026 begitu terbit."),
      h("div", { class: "fm-tiers" }, D.target.map(function (t) {
        var dim = P.lokasi === "jabo" && t.tier !== "3";
        return h("article", { class: "panel fm-tier " + t.kelas + (dim ? " dim" : "") },
          h("div", { class: "row between" }, h("h3", null, "Tier " + t.tier), dim ? h("span", { class: "tag" }, "di luar Jabodetabek") : null),
          h("p", { class: "label" }, t.judul),
          h("ul", { class: "plain-list small" }, t.isi.map(function (x) { return h("li", null, x); })));
      })),
      h("div", { class: "note" }, h("b", null, "Hindari bila tujuan utama Anda peluang lolos: "),
        h("ul", { class: "plain-list" }, D.hindari.map(function (x) { return h("li", null, x); }))));

    // ---------- jabatan ----------
    var tampil = D.jabatan.filter(function (j) { return !P.nonverbal || j.lisan !== "tinggi"; });
    var sembunyi = D.jabatan.filter(function (j) { return tampil.indexOf(j) < 0; });
    var jabatan = h("section", { class: "stack", "aria-labelledby": "fm-jab" },
      h("h2", { id: "fm-jab" }, "Jabatan yang menerima " + D.jurusan),
      h("p", { class: "lede" }, "Urut dari yang paling cocok: sedikit bicara, persaingan rendah, dekat minat IT. Semua contoh diambil dari pengumuman dan rekap hasil CPNS 2024. Nama jabatan saja tidak cukup: di satu instansi Pranata Humas menerima Ilmu Komunikasi, di instansi lain tidak."),
      h("div", { class: "peta-grid" }, tampil.map(function (j) {
        var sg = SAING[j.saing] || ["", j.saing], ls = LISAN[j.lisan] || ["", ""];
        return h("article", { class: "peta-card" },
          h("h3", null, j.nama),
          h("div", { class: "row" }, h("span", { class: "tag " + sg[0] }, sg[1]), h("span", { class: "tag " + ls[0] }, ls[1]), h("span", { class: "tag accent" }, COCOK[j.cocok] || "")),
          h("p", { class: "small" }, j.tugas),

        sembunyi.map(function (j) { return j.nama; }).join(", ") + ". Semuanya menerima Ilmu Komunikasi pada 2024; matikan filter di Cek profil untuk melihat rinciannya.") : null,

    // ---------- aturan ----------
    var aturan = h("section", { class: "panel", "aria-labelledby": "fm-aturan" },

    function addKandidat(e) {

      h("h2", { id: "fm-kalk" }, "Kalkulator peluang"),

        h("label", { class: "field grow" }, h("span", { class: "label" }, "Formasi (jabatan, instansi, lokasi)"), h("input", { class: "input wide", name: "nama", placeholder: "Arsiparis Ahli Pertama, PTN X" })),

<script>
/* Tampilan: router hash + semua layar. */
(function () {
  "use strict";
  var SKD = window.SKD, CFG = SKD.config, E = SKD.engine, S = SKD.store, F = SKD.fig;
  var app = document.getElementById("app");
  var LET = ["A", "B", "C", "D", "E"];

  // ---------- util DOM ----------
  function h(tag, attrs) {
    var el = document.createElement(tag), k, i;
    if (attrs) {
      for (k in attrs) {
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;

  }
  function add(el, kid) {
    if (kid == null || kid === false) return;

    el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtTime(sec, hours) {
    sec = Math.max(0, Math.round(sec));
    var hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), ss = sec % 60;
    return hours ? pad(hh) + ":" + pad(mm) + ":" + pad(ss) : pad(hh * 60 + mm) + ":" + pad(ss);
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function dec(n) { return (Math.round(n * 10) / 10).toString().replace(".", ","); }
  function fmtDate(t) {
    var d = new Date(t), bln = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
    return d.getDate() + " " + bln[d.getMonth()] + " " + d.getFullYear() + ", " + pad(d.getHours()) + "." + pad(d.getMinutes());
  }
  function meter(p, cls) {
    return h("div", { class: "meter" + (cls ? " " + cls : ""), role: "img", "aria-label": p + " persen" }, h("i", { style: "width:" + Math.max(0, Math.min(100, p)) + "%" }));
  }
  function sevClass(p) { return p >= 70 ? "" : p >= 50 ? "warn" : "bad"; }
  function isMiss(it) { return it.chosen == null ? true : it.pq.sec === "tkp" ? it.pts <= 3 : it.pts < 5; }
  function passOf(secId) { return S.settings().pass[secId]; }

  var ui = {
    route: "beranda", session: null, result: null, saved: null,
    setup: { sec: "twk", off: {}, n: 10, hot: false },
    sim: { scale: "full", instant: null },
    rvFilter: "salah", railOpen: null, tick: null, lastTick: 0, ticks: 0
  };

  // ---------- dialog & toast ----------
  var modalRoot = document.getElementById("modal-root"), toastEl = document.getElementById("toast"), toastTimer = null;
  function closeModal() { modalRoot.textContent = ""; }
  function modal(o) {
    closeModal();
    var cancel = h("button", { class: "btn", type: "button", onclick: closeModal }, o.cancel || "Batal");
    var ok = h("button", { class: "btn " + (o.okClass || "primary"), type: "button", onclick: function () { closeModal(); o.onOk(); } }, o.ok);
    var box = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "modal-ttl" },
      h("h2", { id: "modal-ttl" }, o.title), h("p", null, o.body), h("div", { class: "row" }, cancel, ok));
    var bd = h("div", { class: "backdrop", onclick: function (e) { if (e.target === bd) closeModal(); } }, box);
    modalRoot.appendChild(bd);
    cancel.focus();

  function toast(msg) {

    toastEl.hidden = false;
    clearTimeout(toastTimer);

  }

  // ---------- sesi ----------
  function saveSession() { if (ui.session) S.saveSession(ui.session); }
  function begin(s) {
    ui.session = s;
    ui.saved = null;
    ui.railOpen = null;
    saveSession();
    go("kerjakan");
  }
  function guardNew(fn) {
    var sv = ui.saved || S.loadSession();
    var answered = sv ? sv.items.filter(function (i) { return i.chosen != null; }).length : 0;
    if (sv && answered > 0) {
      modal({
        title: "Mulai sesi baru?", ok: "Mulai baru",
        body: "Ada " + (sv.kind === "simulasi" ? "simulasi" : "latihan") + " yang belum selesai (" + answered + " soal terjawab). Memulai sesi baru akan menghapusnya.",
        onOk: fn
      });
    } else fn();
  }
  function startPractice(o) {
    guardNew(function () {
      var items = E.buildPractice({ materi: o.materi, n: o.n, hot: o.hot }, S.qstats());
      if (!items.length) { toast("Belum ada soal untuk pilihan ini."); return; }
      begin({ kind: "latihan", scale: null, title: o.title, instant: true, requeue: S.settings().requeue, items: items, cur: 0, limit: 0, elapsed: 0 });
    });
  }
  function startSim(scale, instant) {
    guardNew(function () {
      var items = E.buildSimulation(scale, S.qstats());
      begin({
        kind: "simulasi", scale: scale, title: "Simulasi CAT SKD", instant: instant, requeue: false, items: items, cur: 0,
        limit: (scale === "mini" ? CFG.exam.minutes / 2 : CFG.exam.minutes) * 60, elapsed: 0
      });
    });
  }
  function startReview(ids, title) {
    guardNew(function () {
      var items = E.buildFromIds(ids.slice(0, 30));
      if (!items.length) { toast("Tidak ada soal yang perlu diulang."); return; }
      begin({ kind: "latihan", scale: null, title: title, instant: true, requeue: true, items: items, cur: 0, limit: 0, elapsed: 0 });
    });
  }
  function resume() {
    var sv = ui.saved || S.loadSession();
    if (!sv) { toast("Tidak ada sesi tersimpan."); return; }
    ui.session = sv;
    ui.saved = null;
    go("kerjakan");
  }

  function stopTimer() { clearInterval(ui.tick); ui.tick = null; }
  function startTimer() {
    stopTimer();
    ui.lastTick = Date.now();
    ui.tick = setInterval(function () {
      var s = ui.session;
      if (!s || ui.route !== "kerjakan") { stopTimer(); return; }
      var now = Date.now(), d = Math.round((now - ui.lastTick) / 1000);
      if (d < 1) return;
      ui.lastTick += d * 1000;
      s.elapsed += d;
      if (s.limit && s.elapsed >= s.limit) { s.elapsed = s.limit; finish(true); return; }
      paintClock();
      if (++ui.ticks % 10 === 0) saveSession();

  }
  function paintClock() {
    var s = ui.session, el = document.getElementById("clock");
    if (!s || !el) return;
    var left = s.limit - s.elapsed;
    el.textContent = s.limit ? fmtTime(left, true) : fmtTime(s.elapsed);
    if (s.limit) el.parentNode.className = "time" + (left <= 300 ? " low" : "");
  }

  function choose(idx) {
    var s = ui.session;
    if (!s) return;
    var it = s.items[s.cur];
    if (idx < 0 || idx >= it.pq.opts.length) return;
    if (s.instant) {
      if (it.done) return;
      it.chosen = idx;
      it.pts = it.pq.opts[idx].pts;
      it.done = true;
      S.record(it.pq, it.pts);
      if (s.requeue && isMiss(it) && (it.tries || 0) < 2) {
        var again = { pq: E.again(it.pq), chosen: null, pts: null, done: false, retry: true, tries: (it.tries || 0) + 1 };
        s.items.splice(Math.min(s.items.length, s.cur + 5), 0, again);
      }
    } else {
      it.chosen = idx;
      it.pts = it.pq.opts[idx].pts;
    }
    saveSession();
    render();
    var fb = document.getElementById("fb"), nx = document.getElementById("btn-next");
    if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
    if (nx && s.instant) nx.focus({ preventScroll: true });
  }
  function goTo(i) {
    var s = ui.session;
    if (!s || i < 0 || i >= s.items.length) return;
    s.cur = i;
    saveSession();
    render(true);
  }
  function next() {
    var s = ui.session;
    if (!s) return;
    if (s.cur < s.items.length - 1) return goTo(s.cur + 1);
    var firstUn = -1;
    s.items.forEach(function (it, i) { if (firstUn < 0 && it.chosen == null) firstUn = i; });
    if (firstUn >= 0) { toast("Masih ada soal yang belum dijawab."); return goTo(firstUn); }
    if (s.kind === "latihan") finish(); else askFinish();
  }
  function askFinish() {
    var s = ui.session;
    if (!s) return;
    var un = s.items.filter(function (i) { return i.chosen == null; }).length, exam = s.kind === "simulasi";
    if (!exam && !un) return finish();
    modal({
      title: exam ? "Selesaikan ujian?" : "Akhiri latihan?", ok: exam ? "Ya, selesai" : "Akhiri", okClass: "danger", cancel: "Kembali ke soal",
      body: (un ? "Masih ada " + un + " soal yang belum dijawab. " : "Semua soal sudah dijawab. ") + (exam ? "Setelah selesai, jawaban tidak bisa diubah." : "Soal yang belum dijawab tidak dihitung."),
      onOk: function () { finish(); }
    });
  }
  function finish(auto) {
    var s = ui.session;
    if (!s) return;
    stopTimer();
    closeModal();
    if (!s.instant) s.items.forEach(function (it) { if (it.chosen != null) S.record(it.pq, it.pts); });
    var sc = E.score(s.items), res = { kind: s.kind, scale: s.scale, title: s.title, instant: s.instant, items: s.items, score: sc, elapsed: s.elapsed, limit: s.limit, auto: !!auto, at: Date.now() };
    if (s.kind === "simulasi" && sc.answered > 0) {
      var hs = {}, sim = simScores(res);
      CFG.sections.forEach(function (sec) { hs[sec.id] = [sim[sec.id].scaled, sc.sec[sec.id].answered, sc.sec[sec.id].n]; });
      S.addHistory({ t: res.at, kind: s.scale, s: hs, total: sim.total, pass: sim.pass, dur: s.elapsed, instant: s.instant });
    }
    S.clearSession();
    ui.session = null;
    ui.saved = null;
    ui.result = res;
    ui.rvFilter = "salah";
    go("hasil");
    if (auto) toast("Waktu habis. Ujian diakhiri otomatis.");
  }
  /** Nilai simulasi per subtes; paket setengah disetarakan ke skala penuh. */
  function simScores(res) {
    var out = { total: 0, pass: true };
    CFG.sections.forEach(function (sec) {
      var b = res.score.sec[sec.id], scaled = b.n ? Math.round((b.pts * sec.count) / b.n) : 0, ok = scaled >= passOf(sec.id);
      out[sec.id] = { raw: b.pts, scaled: scaled, ok: ok };
      out.total += scaled;
      if (!ok) out.pass = false;
    });
    return out;
  }

  // ---------- bagian soal ----------
  function figBox(spec) {
    return h("span", { class: "fig" + (spec.k === "q" ? " q" : ""), role: "img", "aria-label": F.describe(spec), html: F.svg(spec) });
  }
  function stemView(st) {
    if (!st) return null;
    if (st.layout === "matriks") return h("div", { class: "stem matriks" }, st.figs.map(figBox));
    if (st.layout === "jaring") return h("div", { class: "stem jaring" }, st.figs.map(figBox));
    var kids = [];
    st.figs.forEach(function (f, i) {
      if (st.layout === "analogi" && i > 0) kids.push(h("span", { class: "sep", "aria-hidden": "true" }, i === 2 ? "=" : ":"));
      kids.push(figBox(f));
    });
    return h("div", { class: "stem" }, kids);
  }
  function tableView(tb) {
    if (!tb) return null;
    return h("div", { class: "qtable" }, h("table", null,
      h("thead", null, h("tr", null, tb.h.map(function (c) { return h("th", null, c); }))),
      h("tbody", null, tb.r.map(function (r) { return h("tr", null, r.map(function (c) { return h("td", null, c); })); }))));
  }
  function ptsTag(pts) {
    return h("span", { class: "tag " + (pts === 5 ? "ok" : pts === 4 ? "accent" : pts === 3 ? "warn" : "bad") }, pts + " poin");
  }
  /** Daftar opsi. reveal = tampilkan kunci; onPick = null berarti hanya baca. */
  function optsView(it, reveal, onPick) {
    var pq = it.pq, isFig = !!pq.opts[0].fig, tkp = pq.sec === "tkp";
    return h("ul", { class: "opts" + (isFig ? " figs" : "") }, pq.opts.map(function (o, i) {
      var cls = "opt", tag = null, mark = LET[i], picked = it.chosen === i;
      if (reveal) {
        if (tkp) {
          tag = ptsTag(o.pts);
          if (i === pq.best) { cls += " is-right"; mark = "✓"; }
          else if (picked) { cls += o.pts === 4 ? " is-mid" : " is-wrong"; }
          else cls += " is-dim";
        } else if (i === pq.best) {
          cls += " is-right"; mark = "✓";
          tag = h("span", { class: "tag ok" }, picked ? "Benar" : "Jawaban benar");
        } else if (picked) {
          cls += " is-wrong"; mark = "✕";
          tag = h("span", { class: "tag bad" }, "Pilihan Anda");
        } else cls += " is-dim";
        if (tkp && picked) tag = h("span", { class: "row", style: "gap:6px" }, h("span", { class: "tag" }, "Pilihan Anda"), tag);
      } else if (picked) cls += " is-picked";
      var body = isFig ? h("span", { class: "opt-t" }, figBox(o.fig)) : h("span", { class: "opt-t" }, o.t);

      return h("li", null, h("button", {

        "data-opt": i, onclick: onPick ? function () { onPick(i); } : null
      }, h("span", { class: "opt-k", "aria-hidden": isFig ? "true" : null }, mark), body, tag ? h("span", { class: "opt-tag" }, tag) : null));

  }
  function feedbackView(it) {
    var pq = it.pq, tkp = pq.sec === "tkp", cls, verdict;
    if (it.chosen == null) { cls = ""; verdict = "Tidak dijawab. Jawaban " + (tkp ? "bernilai 5: " : "benar: ") + LET[pq.best]; }
    else if (it.pts === 5) { cls = "right"; verdict = tkp ? "Tepat, 5 poin" : "Benar"; }
    else if (tkp) { cls = it.pts === 4 ? "mid" : "wrong"; verdict = it.pts + " poin. Jawaban bernilai 5: " + LET[pq.best]; }

  // ---------- layar kuis ----------
  function numClass(s, it, i) {

    } else c += it.chosen != null ? " ans" : " un";

  }
  function viewQuiz() {
    var s = ui.session, it = s.items[s.cur], exam = s.kind === "simulasi", total = s.items.length;
    var answered = s.items.filter(function (i) { return i.chosen != null; }).length;
    var right = s.items.filter(function (i) { return i.done && i.pts === 5; }).length;

    var info = exam

        h("div", { class: "opt-hide" }, h("span", null, "Jumlah soal"), h("b", null, total)),
        h("div", null, h("span", null, "Dijawab"), h("b", null, answered)),
        h("div", null, h("span", null, "Belum dijawab"), h("b", null, total - answered)),
        h("div", { class: "time" }, h("span", null, "Sisa waktu"), h("b", { id: "clock" }, ""))]
      : [h("div", null, h("span", null, "Soal"), h("b", null, s.cur + 1 + " / " + total)),
        h("div", null, h("span", null, "Benar"), h("b", null, right + " / " + answered)),
        h("div", { class: "time" }, h("span", null, "Waktu"), h("b", { id: "clock" }, ""))];
    var bar = h("div", { class: "catbar" },
      h("div", { class: "ttl" }, s.title, exam ? h("span", { class: "tag" }, s.instant ? "Koreksi langsung" : "Seperti ujian asli") : null),

  // ---------- statistik ----------
  function viewStats() {

        rows.push(h("tr", null, h("td", null, m.name), h("td", { class: "n" }, st.seen),

      h("section", { class: "stack" }, h("h2", null, "Riwayat simulasi"),
        hist.length ? histTable(hist.slice().reverse()) : h("p", { class: "muted" }, "Belum ada simulasi yang selesai."))
    ];
  }

  // ---------- peta materi ----------
  function viewMap() {
    var R = CFG.riset;
    return [
      h("div", { class: "stack" }, h("h1", null, "Peta materi"),
        h("p", { class: "lede" }, "Soal CAT bersifat rahasia dan diacak untuk tiap peserta, jadi tidak ada yang bisa memastikan soal tertentu keluar. Yang bisa dipetakan adalah materi dalam kisi-kisi resmi dan pola soal yang paling sering dilaporkan peserta. Bank soal di sini ditimbang ke pola-pola itu.")),
      h("section", { class: "panel" }, h("h2", null, "Status per " + R.tanggal), h("ul", { class: "plain-list" }, R.status.map(function (t) { return h("li", null, t); }))),
      h("section", { class: "panel" }, h("h2", null, "Yang paling sering dilaporkan keluar"),
        R.rumus ? h("p", { class: "note info" }, R.rumus) : null,
        h("ul", { class: "plain-list" }, R.temuan.map(function (t) { return h("li", null, t); }))),
      CFG.sections.map(function (sec) {
        return h("section", { class: "stack" }, h("h2", null, sec.short + " · " + sec.name),
          h("div", { class: "peta-grid" }, CFG.materi.filter(function (m) { return m.sec === sec.id; }).map(function (m) {
            return h("article", { class: "peta-card" },
              h("div", { class: "row between" }, h("h3", null, m.name), h("span", { class: "tag" }, "±" + m.quota + " soal per ujian")),
              h("p", { class: "small muted" }, m.def),

                h("span", { class: "small muted" }, m.gen >= 1 ? "Soal dibangkitkan otomatis" : E.poolOf(m.id).length + " soal di bank" + (m.gen ? ", ditambah soal otomatis" : "")),
                h("button", { class: "btn sm", type: "button", onclick: function () { startPractice({ materi: [m.id], n: 10, hot: false, title: "Latihan " + m.name }); } }, "Latih materi ini")));

      h("section", { class: "panel" }, h("h2", null, "Sumber"),
        h("p", { class: "small muted" }, "Jumlah soal per materi tidak dipublikasikan resmi. Angka perkiraan di atas disusun dari laporan peserta dan bisa berbeda di ujian sesungguhnya."),
        h("ul", { class: "plain-list" }, R.sumber.map(function (s) { return h("li", null, h("a", { href: s.u, target: "_blank", rel: "noopener" }, s.t)); })))
    ];
  }

  // ---------- pengaturan ----------
  function viewSettings() {
    var set = S.settings();
    return [
      h("div", { class: "stack" }, h("h1", null, "Pengaturan")),
      h("section", { class: "panel" }, h("h2", null, "Ambang batas"),
        h("p", { class: "small muted" }, "Bawaan mengikuti KepmenPANRB 321/2024. Ubah bila keputusan untuk CPNS 2026 menetapkan angka lain."),
        h("div", { class: "row" }, CFG.sections.map(function (s) {
          return h("label", { class: "field" }, h("span", { class: "label" }, s.short + " (maks " + s.max + ")"),
            h("input", {
              class: "input", type: "number", id: "pass-" + s.id, min: 1, max: s.max, value: set.pass[s.id], inputmode: "numeric",
              onchange: function (e) {
                var v = Math.round(Number(e.target.value));
                if (v >= 1 && v <= s.max) { S.setPass(s.id, v); toast("Ambang batas " + s.short + " disimpan: " + v); }

        h("div", { class: "row" }, h("button", { class: "btn sm", type: "button", onclick: function () { S.resetPass(); render(); toast("Ambang batas dikembalikan ke 65, 80, 166."); } }, "Kembalikan ke bawaan"))),

          h("span", null, h("b", null, "Koreksi langsung pada simulasi. "), "Jawaban benar ditandai hijau begitu Anda memilih. Matikan untuk simulasi seperti ujian asli.")),
        h("label", { class: "check" }, h("input", { type: "checkbox", id: "set-requeue", checked: set.requeue, onchange: function (e) { S.setFlag("requeue", e.target.checked); } }),
          h("span", null, h("b", null, "Ulangi yang salah sampai benar. "), "Berlaku pada mode latihan."))),
      h("section", { class: "panel" }, h("h2", null, "Data progres"),

        h("div", { class: "row" }, h("button", {

          onclick: function () {
            modal({ title: "Hapus semua progres?", body: "Statistik per soal, daftar soal yang perlu diulang, dan riwayat simulasi akan dihapus. Tindakan ini tidak bisa dibatalkan.", ok: "Hapus", okClass: "danger", onOk: function () { S.resetAll(); ui.saved = null; ui.result = null; render(); toast("Progres dihapus."); } });
          }
        }, "Hapus semua progres")))

  // ---------- formasi (isi ada di js/formasi.js) ----------
  function viewFormasi() {
    return SKD.formasiView({ h: h, toast: toast, rerender: function () { render(); }, history: function () { return S.history(); } });
  }

  // ---------- router ----------
  var VIEWS = { beranda: viewHome, latihan: viewPractice, simulasi: viewSim, ulang: viewReview, statistik: viewStats, peta: viewMap, formasi: viewFormasi, atur: viewSettings, kerjakan: viewQuiz, hasil: viewResult };
  function go(route) {
    if (location.hash.slice(1) === route) onHash();
    else location.hash = route;
  }
  function onHash() {
    var r = location.hash.slice(1) || "beranda";
    if (!VIEWS[r]) r = "beranda";
    if (r === "kerjakan" && !ui.session) r = "beranda";
    if (r === "hasil" && !ui.result) r = "beranda";
    if (r !== "kerjakan" && ui.session) { saveSession(); ui.saved = ui.session; ui.session = null; stopTimer(); }
    ui.route = r;
    closeModal();
    render(true);
    if (r === "kerjakan") startTimer();
  }
  function render(toTop) {
    document.body.classList.toggle("in-quiz", ui.route === "kerjakan");
    Array.prototype.forEach.call(document.querySelectorAll("#nav a"), function (a) {
      if (a.getAttribute("href") === "#" + ui.route) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    var sync = document.getElementById("sync");
    sync.hidden = S.cloudState() !== "aktif";
    var y = window.scrollY;
    app.textContent = "";
    add(app, VIEWS[ui.route]());
    if (ui.route === "kerjakan") paintClock();
    if (toTop) window.scrollTo(0, 0); else window.scrollTo(0, y);
  }

  document.addEventListener("keydown", function (e) {
    if (modalRoot.firstChild) { if (e.key === "Escape") closeModal(); return; }
    if (ui.route !== "kerjakan" || !ui.session || e.ctrlKey || e.metaKey || e.altKey) return;
    var tg = e.target, tn = tg && tg.tagName;
    if (tn === "INPUT" || tn === "TEXTAREA" || tn === "SELECT") return;
    var k = e.key.toLowerCase(), idx = "abcde".indexOf(k);
    if (idx < 0 && k.length === 1) idx = "12345".indexOf(k);
    if (idx >= 0 && k.length === 1) { e.preventDefault(); choose(idx); return; }
    if (e.key === "Enter" && tn !== "BUTTON" && tn !== "A" && tn !== "SUMMARY") {
      var s = ui.session, it = s.items[s.cur];
      if (!s.instant || it.done) { e.preventDefault(); next(); }
    }
  });

  window.addEventListener("pagehide", saveSession);

  S.init();
  S.onChange(function () { if (ui.route !== "kerjakan") render(); });
  ui.saved = S.loadSession();
  // Halaman dimuat ulang di tengah sesi: langsung lanjutkan, jangan lempar ke beranda.
  if (location.hash === "#kerjakan" && ui.saved) { ui.session = ui.saved; ui.saved = null; }
  onHash();

  SKD.ui = ui; // untuk pengujian
})();
